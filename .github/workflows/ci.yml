name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    name: product names in ASCII
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Product names in ASCII
        run: bash scripts/check-ascii-names.sh
