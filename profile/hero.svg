<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ah-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
  </defs>

  <!-- canvas -->
  <rect x="8" y="8" width="1264" height="834" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- title -->
  <text x="60" y="52" font-size="28" font-weight="700" fill="#1f2328">Yggdrasil</text>
  <text x="60" y="74" font-size="13" fill="#57606a">IIoT governance spine &#8212; OT &#8594; governance &#8594; IT</text>
  <text x="1216" y="46" text-anchor="end" font-size="12" fill="#57606a">zero shared code</text>
  <text x="1216" y="66" text-anchor="end" font-size="12" fill="#57606a">coupled only by data &amp; wire contract</text>

  <!-- ============ CANOPY : IT / UNS ============ -->
  <rect x="40" y="92" width="1200" height="104" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="58" y="116" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">IT &#183; UNS &#8212; NORTHBOUND (UNIFIED NAMESPACE)</text>
  <rect x="425" y="136" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="485" y="166" text-anchor="middle" font-size="12.5" fill="#1f2328">MQTT</text>
  <rect x="580" y="136" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="166" text-anchor="middle" font-size="12.5" fill="#1f2328">Kafka</text>
  <rect x="735" y="136" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="795" y="166" text-anchor="middle" font-size="12.5" fill="#1f2328">MES</text>

  <!-- ============ GOVERNANCE SPINE (trunk) ============ -->
  <rect x="480" y="214" width="320" height="438" rx="10" fill="#eef5ff" stroke="#cfe0f5"/>
  <text x="498" y="240" font-size="11" font-weight="700" letter-spacing="1" fill="#0969da">GOVERNANCE SPINE</text>
  <text x="640" y="278" text-anchor="middle" font-size="11.5" fill="#1f2328">one governed contract, enforced</text>
  <text x="640" y="296" text-anchor="middle" font-size="11" fill="#57606a">schema &#183; spec &#183; provenance &#183; activation</text>

  <!-- Bifrost : protagonist -->
  <rect x="520" y="332" width="240" height="76" rx="6" fill="#eaf3ea" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="640" y="365" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Bifrost</text>
  <text x="640" y="385" text-anchor="middle" font-size="11" fill="#57606a">governance core &#183; IAM</text>

  <!-- Heimdall : authz write boundary -->
  <rect x="520" y="502" width="240" height="66" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="640" y="531" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Heimdall</text>
  <text x="640" y="550" text-anchor="middle" font-size="11" fill="#57606a">authz &#183; write boundary</text>

  <!-- ============ BRANCHES : Mimir / Muninn ============ -->
  <rect x="155" y="337" width="190" height="66" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="250" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">M&#237;mir</text>
  <text x="250" y="385" text-anchor="middle" font-size="11" fill="#57606a">model &#183; derive</text>

  <rect x="935" y="337" width="190" height="66" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1030" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">Muninn</text>
  <text x="1030" y="385" text-anchor="middle" font-size="11" fill="#57606a">feed UNS &#183; egress-validate</text>

  <!-- ============ ROOTS : OT / FIELD ============ -->
  <rect x="40" y="688" width="1200" height="108" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="58" y="712" font-size="11" font-weight="700" letter-spacing="1" fill="#8b95a1">OT &#183; FIELD &#8212; SOUTHBOUND (COMMAND / WRITE)</text>
  <rect x="425" y="726" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="485" y="756" text-anchor="middle" font-size="12.5" fill="#1f2328">PLC</text>
  <rect x="580" y="726" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="756" text-anchor="middle" font-size="12.5" fill="#1f2328">OPC-UA</text>
  <rect x="735" y="726" width="120" height="50" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="795" y="756" text-anchor="middle" font-size="12.5" fill="#1f2328">sim</text>

  <!-- ============ EDGES ============ -->
  <!-- data: Mimir -> Bifrost -->
  <polyline points="345,370 520,370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <g><rect x="384" y="362" width="104" height="16" fill="#ffffff"/><text x="388" y="374" font-size="11" fill="#57606a">derive &#8594; govern</text></g>
  <!-- data: Bifrost -> Muninn -->
  <polyline points="760,370 935,370" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <g><rect x="808" y="362" width="86" height="16" fill="#ffffff"/><text x="812" y="374" font-size="11" fill="#57606a">governed bytes</text></g>
  <!-- data: Muninn -> canopy (MQTT / Sparkplug B) -->
  <polyline points="1030,337 1030,205 485,205 485,186" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <g><rect x="953" y="262" width="154" height="16" fill="#ffffff"/><text x="957" y="274" font-size="11" fill="#57606a">NDATA &#183; Sparkplug B</text></g>

  <!-- observation: PLC -> Mimir (browse) -->
  <polyline points="485,726 485,672 250,672 250,403" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ah-grey)"/>
  <g><rect x="330" y="664" width="68" height="16" fill="#ffffff"/><text x="334" y="676" font-size="11" fill="#57606a">browse type</text></g>
  <!-- observation: sim -> Muninn (sample) -->
  <polyline points="795,726 795,672 1030,672 1030,403" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ah-grey)"/>
  <g><rect x="893" y="664" width="46" height="16" fill="#ffffff"/><text x="897" y="676" font-size="11" fill="#57606a">sample</text></g>

  <!-- command: Bifrost -> Heimdall -->
  <polyline points="640,408 640,502" fill="none" stroke="#9a6700" stroke-width="1.8" marker-end="url(#ah-amber)"/>
  <g><rect x="610" y="447" width="60" height="16" fill="#eef5ff"/><text x="614" y="459" font-size="11" fill="#9a6700">authorize</text></g>
  <!-- command: Heimdall -> OPC-UA (write) -->
  <polyline points="640,568 640,726" fill="none" stroke="#9a6700" stroke-width="1.8" marker-end="url(#ah-amber)"/>
  <g><rect x="609" y="647" width="62" height="16" fill="#ffffff"/><text x="613" y="659" font-size="11" fill="#9a6700">NCMD write</text></g>

  <!-- ============ LEGEND + loop caption ============ -->
  <line x1="60" y1="822" x2="92" y2="822" stroke="#57606a" stroke-width="1.6"/>
  <text x="98" y="826" font-size="11" fill="#57606a">data (governed bytes)</text>
  <line x1="252" y1="822" x2="284" y2="822" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="290" y="826" font-size="11" fill="#57606a">observation</text>
  <line x1="404" y1="822" x2="436" y2="822" stroke="#9a6700" stroke-width="1.8"/>
  <text x="442" y="826" font-size="11" fill="#9a6700">command / write</text>
  <text x="1216" y="826" text-anchor="end" font-size="11" fill="#57606a">closed loop: observe &#8594; command &#8594; observe</text>
</svg>
