<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

  <defs>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ah-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
    <marker id="ah-obs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b95a1"/></marker>
  </defs>

  <rect x="6" y="6" width="828" height="748" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="28" y="48" font-size="22" font-weight="700" fill="#1f2328">Yggdrasil</text>
  <text x="28" y="72" font-size="12.5" fill="#57606a">IIoT governance spine — OT → governance → IT</text>
  <text x="812" y="44" font-size="11" fill="#8b95a1" text-anchor="end">zero shared code</text>
  <text x="812" y="62" font-size="11" fill="#8b95a1" text-anchor="end">coupled only by data &amp; wire contract</text>

  <!-- ===== northbound ===== -->
  <rect x="24" y="104" width="792" height="92" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="128" font-size="11" font-weight="700" fill="#8b95a1" letter-spacing="1">IT · UNS — NORTHBOUND (UNIFIED NAMESPACE)</text>
  <rect x="165" y="146" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="240" y="171" font-size="12.5" fill="#1f2328" text-anchor="middle">MQTT</text>
  <rect x="345" y="146" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="420" y="171" font-size="12.5" fill="#1f2328" text-anchor="middle">Kafka</text>
  <rect x="525" y="146" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="171" font-size="12.5" fill="#1f2328" text-anchor="middle">MES</text>

  <!-- ===== the spine ===== -->
  <rect x="224" y="216" width="392" height="254" rx="10" fill="#eef5ff" stroke="#cfe0f5"/>
  <text x="244" y="240" font-size="11" font-weight="700" fill="#0969da" letter-spacing="1">GOVERNANCE SPINE</text>
  <text x="420" y="258" font-size="11.5" fill="#1f2328" text-anchor="middle">one governed contract, enforced</text>
  <text x="420" y="276" font-size="11" fill="#57606a" text-anchor="middle">schema · spec · provenance · activation</text>

  <rect x="290" y="292" width="260" height="58" rx="6" fill="#eaf3ea" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="420" y="316" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Bifrost</text>
  <text x="420" y="336" font-size="11" fill="#57606a" text-anchor="middle">governance core · IAM</text>

  <rect x="290" y="398" width="260" height="58" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="420" y="422" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Heimdall</text>
  <text x="420" y="442" font-size="11" fill="#57606a" text-anchor="middle">authz · write boundary</text>

  <rect x="24" y="292" width="176" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="112" y="316" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Mímir</text>
  <text x="112" y="336" font-size="11" fill="#57606a" text-anchor="middle">model · derive</text>

  <rect x="640" y="292" width="176" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="728" y="313" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Muninn</text>
  <text x="728" y="331" font-size="11" fill="#57606a" text-anchor="middle">feed UNS</text>
  <text x="728" y="345" font-size="11" fill="#57606a" text-anchor="middle">egress-validate</text>

  <!-- ===== governed bytes, north ===== -->
  <polyline points="200,314 290,314" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="204" y="306" font-size="11" fill="#57606a">derive → govern</text>
  <polyline points="550,314 640,314" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="556" y="306" font-size="11" fill="#57606a">governed bytes</text>
  <polyline points="728,292 728,208 240,208 240,186" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="560" y="202" font-size="11" fill="#57606a">NDATA · Sparkplug B</text>

  <!-- ===== command, south ===== -->
  <polyline points="420,350 420,398" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#ah-amber)"/>
  <text x="430" y="379" font-size="11" fill="#9a6700">authorize</text>

  <!-- ===== southbound ===== -->
  <rect x="24" y="490" width="792" height="92" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="40" y="514" font-size="11" font-weight="700" fill="#8b95a1" letter-spacing="1">OT · FIELD — SOUTHBOUND (COMMAND / WRITE)</text>
  <rect x="165" y="526" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="240" y="551" font-size="12.5" fill="#1f2328" text-anchor="middle">PLC</text>
  <rect x="345" y="526" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="420" y="551" font-size="12.5" fill="#1f2328" text-anchor="middle">OPC-UA</text>
  <rect x="525" y="526" width="150" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="600" y="551" font-size="12.5" fill="#1f2328" text-anchor="middle">sim</text>

  <polyline points="420,456 420,526" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#ah-amber)"/>
  <text x="430" y="478" font-size="11" fill="#9a6700">NCMD write</text>

  <!-- ===== observation, back up ===== -->
  <polyline points="165,546 36,546 36,350" fill="none" stroke="#8b95a1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="44" y="424" font-size="11" fill="#8b95a1">browse type</text>
  <polyline points="675,546 760,546 760,350" fill="none" stroke="#8b95a1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="768" y="424" font-size="11" fill="#8b95a1">sample</text>

  <!-- ===== observation arm ===== -->
  <polyline points="420,582 420,616" fill="none" stroke="#8b95a1" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="430" y="604" font-size="11" fill="#8b95a1">pcap</text>
  <rect x="270" y="616" width="300" height="64" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="420" y="642" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Huginn</text>
  <text x="420" y="662" font-size="11" fill="#57606a" text-anchor="middle">decodes the wire, finds undeclared paths</text>
  <text x="584" y="644" font-size="11" fill="#8b95a1">reconciles against a local policy.yaml;</text>
  <text x="584" y="662" font-size="11" fill="#8b95a1">Bifrost’s declaration is not wired in.</text>

  <!-- ===== legend ===== -->
  <polyline points="28,716 58,716" fill="none" stroke="#57606a" stroke-width="1.6"/>
  <text x="66" y="720" font-size="11" fill="#57606a">data (governed bytes)</text>
  <polyline points="200,716 230,716" fill="none" stroke="#8b95a1" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="238" y="720" font-size="11" fill="#57606a">observation</text>
  <polyline points="330,716 360,716" fill="none" stroke="#9a6700" stroke-width="1.6"/>
  <text x="368" y="720" font-size="11" fill="#9a6700">command / write</text>
  <text x="812" y="720" font-size="11" fill="#8b95a1" text-anchor="end">closed loop: observe → command → observe</text>

</svg>
