<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="736" viewBox="0 0 1280 736" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

  <defs>
    <marker id="scG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="scB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
    <marker id="scA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
    <marker id="scR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#cf222e"/></marker>
  </defs>

  <rect x="8" y="8" width="1264" height="720" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="44" font-size="17" font-weight="600" fill="#1f2328">System context: what Yggdrasil sits between</text>
  <text x="40" y="68" font-size="12.5" fill="#57606a">C4 level 1. Two relationships are drawn as missing rather than left out. They are the open axes. Detail: bifrost/docs/ENTERPRISE.md</text>

  <!-- ============ people ============ -->
  <rect x="120" y="96" width="240" height="76" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="240" y="122" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Controls engineer</text>
  <text x="240" y="138" font-size="9.5" fill="#8b95a1" text-anchor="middle">[Person]</text>
  <text x="240" y="157" font-size="10.5" fill="#57606a" text-anchor="middle">changes a recipe, issues a command</text>

  <rect x="520" y="96" width="240" height="76" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="640" y="122" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Approver</text>
  <text x="640" y="138" font-size="9.5" fill="#8b95a1" text-anchor="middle">[Person]</text>
  <text x="640" y="157" font-size="10.5" fill="#57606a" text-anchor="middle">a different person, by construction</text>

  <rect x="920" y="96" width="240" height="76" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1040" y="122" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Auditor</text>
  <text x="1040" y="138" font-size="9.5" fill="#8b95a1" text-anchor="middle">[Person]</text>
  <text x="1040" y="157" font-size="10.5" fill="#57606a" text-anchor="middle">asks what was live, and when</text>

  <!-- ============ the system ============ -->
  <rect x="460" y="250" width="360" height="150" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="640" y="288" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Yggdrasil</text>
  <text x="640" y="306" font-size="9.5" fill="#8b95a1" text-anchor="middle">[Software System]</text>
  <text x="640" y="330" font-size="11" fill="#57606a" text-anchor="middle">declares what is valid, seals which version is live,</text>
  <text x="640" y="348" font-size="11" fill="#57606a" text-anchor="middle">and decides again at the moment of the write</text>
  <text x="640" y="374" font-size="10.5" fill="#57606a" text-anchor="middle">Bifrost · Heimdall · Mímir · Muninn · Huginn</text>

  <!-- ============ neighbours ============ -->
  <rect x="60" y="290" width="250" height="76" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="185" y="316" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Git hosting</text>
  <text x="185" y="332" font-size="9.5" fill="#8b95a1" text-anchor="middle">[External system]</text>
  <text x="185" y="351" font-size="10.5" fill="#57606a" text-anchor="middle">holds the declarations and their history</text>

  <rect x="970" y="290" width="250" height="76" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="1095" y="316" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Vendor tooling</text>
  <text x="1095" y="332" font-size="9.5" fill="#8b95a1" text-anchor="middle">[External system]</text>
  <text x="1095" y="351" font-size="10.5" fill="#57606a" text-anchor="middle">Kepware · Ignition · ThingWorx</text>

  <rect x="300" y="470" width="280" height="86" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="498" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">OT equipment</text>
  <text x="440" y="514" font-size="9.5" fill="#8b95a1" text-anchor="middle">[External system]</text>
  <text x="440" y="533" font-size="10.5" fill="#57606a" text-anchor="middle">OPC UA servers, PLCs, actuators</text>

  <rect x="700" y="470" width="280" height="86" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="840" y="498" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">UNS consumers</text>
  <text x="840" y="514" font-size="9.5" fill="#8b95a1" text-anchor="middle">[External system]</text>
  <text x="840" y="533" font-size="10.5" fill="#57606a" text-anchor="middle">MQTT broker, historian, MES, dashboards</text>

  <rect x="60" y="590" width="200" height="76" rx="6" fill="#ffebe9" stroke="#cf222e"/>
  <text x="160" y="616" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">Unmanaged client</text>
  <text x="160" y="632" font-size="9.5" fill="#8b95a1" text-anchor="middle">[External system]</text>
  <text x="160" y="651" font-size="10.5" fill="#57606a" text-anchor="middle">anything with a session</text>

  <!-- ============ relationships ============ -->
  <polyline points="240,172 240,220 540,220 540,250" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="300" y="212" font-size="10.5" fill="#57606a">proposes a change</text>

  <polyline points="640,172 640,250" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="652" y="212" font-size="10.5" fill="#57606a">approves it</text>

  <polyline points="1040,172 1040,220 740,220 740,250" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="790" y="212" font-size="10.5" fill="#57606a">asks the ledger</text>

  <polyline points="310,328 460,328" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="320" y="320" font-size="10.5" fill="#57606a">versioned declarations</text>

  <polyline points="970,318 820,318" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="828" y="310" font-size="10.5" fill="#0969da">equipment model, read in</text>

  <polyline points="970,346 820,346" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#scA)"/>
  <text x="828" y="380" font-size="10.5" fill="#9a6700">axis 13 · live configuration, never read back</text>

  <polyline points="540,400 540,470" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="550" y="440" font-size="10.5" fill="#0969da">writes, after deciding again</text>

  <polyline points="740,400 740,470" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="750" y="440" font-size="10.5" fill="#0969da">verified definitions, validated samples</text>

  <polyline points="160,590 160,513 300,513" fill="none" stroke="#cf222e" stroke-width="1.6" marker-end="url(#scR)"/>
  <text x="166" y="505" font-size="10.5" fill="#cf222e">axis 12 · no gate here</text>

  <text x="40" y="700" font-size="12" fill="#1f2328">Nothing stops a client that never meets the edge, and nothing reads a vendor runtime's live configuration back to check it against the declaration. Both are drawn because both are open.</text>

</svg>
