<svg xmlns="http://www.w3.org/2000/svg" width="840" height="900" viewBox="0 0 840 900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

  <defs>
    <marker id="scG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
    <marker id="scB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#58a6ff"/></marker>
    <marker id="scA" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
    <marker id="scR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f85149"/></marker>
  </defs>

  <rect x="6" y="6" width="828" height="888" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="28" y="42" font-size="18" font-weight="600" fill="#c9d1d9">System context: what Yggdrasil sits between</text>
  <text x="28" y="66" font-size="13" fill="#8b949e">C4 level 1. Two relationships are drawn as missing rather than left out.</text>
  <text x="28" y="86" font-size="13" fill="#8b949e">They are the open axes. Detail: bifrost/docs/ENTERPRISE.md</text>

  <!-- ============ people ============ -->
  <rect x="28" y="112" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="153" y="140" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Controls engineer</text>
  <text x="153" y="162" font-size="12" fill="#8b949e" text-anchor="middle">proposes a recipe change</text>

  <rect x="295" y="112" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="420" y="140" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Approver</text>
  <text x="420" y="162" font-size="12" fill="#8b949e" text-anchor="middle">a different person, by construction</text>

  <rect x="562" y="112" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="687" y="140" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Auditor</text>
  <text x="687" y="162" font-size="12" fill="#8b949e" text-anchor="middle">asks what was live, and when</text>

  <polyline points="153,180 153,210 380,210 380,330" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="200" y="202" font-size="12" fill="#8b949e">proposes a change</text>
  <polyline points="420,180 420,330" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="430" y="200" font-size="12" fill="#8b949e">approves it</text>
  <polyline points="687,180 687,210 460,210 460,330" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="524" y="200" font-size="12" fill="#8b949e">asks the ledger</text>

  <!-- ============ what it reads ============ -->
  <rect x="28" y="246" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="153" y="274" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Git hosting</text>
  <text x="153" y="296" font-size="12" fill="#8b949e" text-anchor="middle">holds the declarations</text>

  <rect x="562" y="246" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="687" y="274" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Vendor tooling</text>
  <text x="687" y="296" font-size="12" fill="#8b949e" text-anchor="middle">Kepware · Ignition · ThingWorx</text>

  <polyline points="153,314 153,350 290,350" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#scG)"/>
  <text x="32" y="368" font-size="12" fill="#8b949e">versioned declarations</text>

  <polyline points="687,314 687,350 550,350" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="556" y="368" font-size="12" fill="#58a6ff">equipment model, read in</text>

  <polyline points="760,314 760,392 550,392" fill="none" stroke="#d29922" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#scA)"/>
  <text x="556" y="412" font-size="12" fill="#d29922">axis 13 · live configuration,</text>
  <text x="556" y="428" font-size="12" fill="#d29922">never read back</text>

  <!-- ============ the system ============ -->
  <rect x="290" y="330" width="260" height="150" rx="8" fill="#121d2f" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="420" y="366" font-size="17" font-weight="600" fill="#c9d1d9" text-anchor="middle">Yggdrasil</text>
  <text x="420" y="394" font-size="12.5" fill="#8b949e" text-anchor="middle">declares what is valid,</text>
  <text x="420" y="412" font-size="12.5" fill="#8b949e" text-anchor="middle">seals which version is live,</text>
  <text x="420" y="430" font-size="12.5" fill="#8b949e" text-anchor="middle">and decides again at the write</text>
  <text x="420" y="456" font-size="12" fill="#8b949e" text-anchor="middle">Bifrost · Heimdall · Mímir</text>
  <text x="420" y="472" font-size="12" fill="#8b949e" text-anchor="middle">Muninn · Huginn</text>

  <!-- ============ where it lands ============ -->
  <polyline points="380,480 380,540 153,540 153,576" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="160" y="532" font-size="12" fill="#58a6ff">writes, after deciding again</text>

  <polyline points="460,480 460,540 687,540 687,576" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#scB)"/>
  <text x="500" y="532" font-size="12" fill="#58a6ff">verified definitions, samples</text>

  <rect x="28" y="576" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="153" y="604" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">OT equipment</text>
  <text x="153" y="626" font-size="12" fill="#8b949e" text-anchor="middle">OPC UA servers · PLCs</text>

  <rect x="562" y="576" width="250" height="68" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="687" y="604" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">UNS consumers</text>
  <text x="687" y="626" font-size="12" fill="#8b949e" text-anchor="middle">broker · historian · MES</text>

  <!-- ============ the path that never meets the edge ============ -->
  <rect x="28" y="716" width="250" height="68" rx="6" fill="#25171c" stroke="#f85149"/>
  <text x="153" y="744" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Unmanaged client</text>
  <text x="153" y="766" font-size="12" fill="#8b949e" text-anchor="middle">anything with a session</text>

  <polyline points="153,716 153,644" fill="none" stroke="#f85149" stroke-width="1.6" marker-end="url(#scR)"/>
  <text x="165" y="686" font-size="12" fill="#f85149">axis 12 · no gate on this path</text>

  <text x="28" y="836" font-size="13" fill="#c9d1d9">Nothing stops a client that never meets the edge, and nothing reads a</text>
  <text x="28" y="856" font-size="13" fill="#c9d1d9">vendor runtime's live configuration back to check it against the declaration.</text>
  <text x="28" y="876" font-size="13" fill="#c9d1d9">Both are drawn because both are open.</text>

</svg>
