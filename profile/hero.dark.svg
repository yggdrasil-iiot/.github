<svg xmlns="http://www.w3.org/2000/svg" width="840" height="760" viewBox="0 0 840 760" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">

  <defs>
    <marker id="ah-grey" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
    <marker id="ah-amber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
    <marker id="ah-obs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
  </defs>

  <rect x="6" y="6" width="828" height="748" rx="14" fill="#0d1117" stroke="#30363d"/>

  <text x="28" y="48" font-size="22" font-weight="700" fill="#c9d1d9">Yggdrasil</text>
  <text x="28" y="72" font-size="12.5" fill="#8b949e">IIoT 거버넌스 스파인 — OT → 거버넌스 → IT</text>
  <text x="812" y="44" font-size="11" fill="#8b949e" text-anchor="end">공유 코드 0 (zero shared code)</text>
  <text x="812" y="62" font-size="11" fill="#8b949e" text-anchor="end">데이터 및 통신 회선 계약으로만 결합</text>

  <!-- ===== northbound ===== -->
  <rect x="24" y="104" width="792" height="92" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="128" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">IT · UNS — 북향 데이터 플로우 (통합 네임스페이스)</text>
  <rect x="165" y="146" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="240" y="171" font-size="12.5" fill="#c9d1d9" text-anchor="middle">MQTT</text>
  <rect x="345" y="146" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="420" y="171" font-size="12.5" fill="#c9d1d9" text-anchor="middle">Kafka</text>
  <rect x="525" y="146" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="600" y="171" font-size="12.5" fill="#c9d1d9" text-anchor="middle">MES</text>

  <!-- ===== the spine ===== -->
  <rect x="224" y="216" width="392" height="254" rx="10" fill="#101a28" stroke="#22334d"/>
  <text x="244" y="240" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="1">거버넌스 스파인 (GOVERNANCE SPINE)</text>
  <text x="420" y="258" font-size="11.5" fill="#c9d1d9" text-anchor="middle">단일 거버넌스 계약의 엄격한 강제</text>
  <text x="420" y="276" font-size="11" fill="#8b949e" text-anchor="middle">스키마 · 사양 · 출처 검증 · 앵커 활성화</text>

  <rect x="290" y="292" width="260" height="58" rx="6" fill="#0f2f1a" stroke="#3fb950" stroke-width="1.6"/>
  <text x="420" y="316" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Bifrost</text>
  <text x="420" y="336" font-size="11" fill="#8b949e" text-anchor="middle">거버넌스 코어 · IAM 권한 통제</text>

  <rect x="290" y="398" width="260" height="58" rx="6" fill="#121d2f" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="420" y="422" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Heimdall</text>
  <text x="420" y="442" font-size="11" fill="#8b949e" text-anchor="middle">런타임 인가 · 쓰기 경계 통제</text>

  <rect x="24" y="292" width="176" height="58" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="112" y="316" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Mímir</text>
  <text x="112" y="336" font-size="11" fill="#8b949e" text-anchor="middle">모델 도출 (AAS/UDT)</text>

  <rect x="640" y="292" width="176" height="58" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="728" y="313" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Muninn</text>
  <text x="728" y="331" font-size="11" fill="#8b949e" text-anchor="middle">UNS 데이터 피드</text>
  <text x="728" y="345" font-size="11" fill="#8b949e" text-anchor="middle">송출 검증 (Egress)</text>

  <!-- ===== governed bytes, north ===== -->
  <polyline points="200,314 290,314" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="204" y="306" font-size="11" fill="#8b949e">도출 → 거버넌스</text>
  <polyline points="550,314 640,314" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="556" y="306" font-size="11" fill="#8b949e">거버넌스 검증 바이트</text>
  <polyline points="728,292 728,208 240,208 240,186" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah-grey)"/>
  <text x="560" y="202" font-size="11" fill="#8b949e">NDATA · Sparkplug B</text>

  <!-- ===== command, south ===== -->
  <polyline points="420,350 420,398" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#ah-amber)"/>
  <text x="430" y="379" font-size="11" fill="#d29922">명령 인가</text>

  <!-- ===== southbound ===== -->
  <rect x="24" y="490" width="792" height="92" rx="10" fill="#161b22" stroke="#21262d"/>
  <text x="40" y="514" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">OT · 현장 — 남향 제어 플로우 (명령 / 쓰기)</text>
  <rect x="165" y="526" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="240" y="551" font-size="12.5" fill="#c9d1d9" text-anchor="middle">PLC</text>
  <rect x="345" y="526" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="420" y="551" font-size="12.5" fill="#c9d1d9" text-anchor="middle">OPC-UA</text>
  <rect x="525" y="526" width="150" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="600" y="551" font-size="12.5" fill="#c9d1d9" text-anchor="middle">시뮬레이터 (Sim)</text>

  <polyline points="420,456 420,526" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#ah-amber)"/>
  <text x="430" y="478" font-size="11" fill="#d29922">NCMD 쓰기</text>

  <!-- ===== observation, back up ===== -->
  <polyline points="165,546 36,546 36,350" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="44" y="424" font-size="11" fill="#8b949e">타입 브라우징</text>
  <polyline points="675,546 760,546 760,350" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="768" y="424" font-size="11" fill="#8b949e">실시간 샘플링</text>

  <!-- ===== observation arm ===== -->
  <polyline points="420,582 420,616" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-obs)"/>
  <text x="430" y="604" font-size="11" fill="#8b949e">패킷 캡처 (pcap)</text>
  <rect x="270" y="616" width="300" height="64" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="420" y="642" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Huginn</text>
  <text x="420" y="662" font-size="11" fill="#8b949e" text-anchor="middle">회선 패킷 해독, 미선언 통신 경로 적발</text>
  <text x="584" y="644" font-size="11" fill="#8b949e">로컬 policy.yaml 대조 검증 수행</text>
  <text x="584" y="662" font-size="11" fill="#8b949e">(Bifrost 선언문과는 수동 분리)</text>

  <!-- ===== legend ===== -->
  <polyline points="28,716 58,716" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <text x="66" y="720" font-size="11" fill="#8b949e">데이터 (거버넌스 검증 바이트)</text>
  <polyline points="200,716 230,716" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="238" y="720" font-size="11" fill="#8b949e">수동 관측 (Observation)</text>
  <polyline points="330,716 360,716" fill="none" stroke="#d29922" stroke-width="1.6"/>
  <text x="368" y="720" font-size="11" fill="#d29922">제어 명령 / 쓰기 (Command / Write)</text>
  <text x="812" y="720" font-size="11" fill="#8b949e" text-anchor="end">닫힌 루프: 관측 → 제어 명령 → 관측</text>

</svg>

